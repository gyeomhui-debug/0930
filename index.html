<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>2026 디지털혁신 백서 | 장별 검색</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172a43;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;font-size:16px;line-height:1.7}header{background:#102c50;color:white;border-top:5px solid #2b9bcb}header .wrap{padding:28px 24px}.wrap{max-width:1140px;margin:auto;padding:24px}header p{margin:0;color:#b7d1e8;font-size:14px}h1{font-size:clamp(25px,4vw,36px);margin:5px 0}h2{font-size:22px;margin:0 0 10px}.search{background:white;padding:22px;border:1px solid #dae2ec;border-radius:10px}label{display:block;font-weight:700;margin-bottom:8px}.row{display:flex;gap:10px}input{width:100%;min-width:0;padding:13px 15px;border:1px solid #a7b8cc;border-radius:6px;font:inherit}input:focus{outline:3px solid #acdcec}button{font:inherit;padding:10px 16px;border:1px solid #a7b8cc;border-radius:6px;background:#edf3f9;color:#172a43;cursor:pointer;white-space:nowrap}.count{margin:20px 0 12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}article{padding:24px;background:white;border:1px solid #dae2ec;border-radius:10px;box-shadow:0 4px 12px #102c5006}.chapter{font-size:14px;font-weight:700;color:#17618c;display:block;margin-bottom:8px}article p{margin:0;color:#4c5d72;overflow-wrap:anywhere}details{margin-top:14px}summary{color:#17618c;cursor:pointer}.full{white-space:pre-wrap;margin-top:12px!important}.resource{margin-top:26px;display:flex;align-items:center;gap:24px;background:#e7eef7;border-radius:10px;padding:20px}.resource img{width:100px;height:auto;background:white;border:1px solid #d1dae5}.resource p{margin:0;font-size:14px}.resource a{color:#17618c}footer{padding:22px 0;color:#68798b;font-size:14px}.empty{padding:32px;background:white;border-radius:10px;text-align:center;grid-column:1/-1}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{padding:18px}.resource{gap:15px}.resource img{width:75px}}
</style></head>
<body><header><div class="wrap"><p>행정안전부 · 디지털혁신과 · 가상 백서</p><h1>2026 디지털혁신 백서</h1></div></header>
<main class="wrap"><section class="search" aria-label="장 검색"><label for="keyword">백서 장별 검색</label><div class="row"><input id="keyword" type="search" placeholder="제목 또는 본문 키워드 입력" autocomplete="off"><button id="reset" type="button">초기화</button></div></section>
<p id="count" class="count" role="status" aria-live="polite">장 데이터를 불러오는 중입니다.</p><section id="cards" class="grid" aria-label="검색 결과"></section>
<aside class="resource" aria-label="외부 이미지 리소스"><img src="https://upload.wikimedia.org/wikipedia/commons/0/09/Flag_of_South_Korea.svg" alt="대한민국 태극기" width="100" height="67"><div><strong>외부 리소스 · 대한민국 태극기</strong><p><a href="https://commons.wikimedia.org/wiki/File:Flag_of_South_Korea.svg" target="_blank" rel="noopener noreferrer">이미지 출처: Wikimedia Commons</a></p></div></aside><footer>첨부된 백서의 6개 장을 원문 기준으로 제공합니다.</footer></main>
<script>
const input=document.getElementById('keyword'),cards=document.getElementById('cards'),count=document.getElementById('count');
let chapters=[];
const plain=text=>text.replace(/^#{1,6}\s*/gm,'').replace(/\*\*/g,'').replace(/\s+/g,' ').trim();
function render(){const keyword=input.value.trim().toLocaleLowerCase('ko');const found=chapters.filter(c=>(c.제목+' '+c.본문).toLocaleLowerCase('ko').includes(keyword));count.textContent=`결과 ${found.length}건`;cards.replaceChildren();for(const c of found){const card=document.createElement('article'),number=document.createElement('span'),title=document.createElement('h2'),summary=document.createElement('p'),details=document.createElement('details'),toggle=document.createElement('summary'),full=document.createElement('p');number.className='chapter';number.textContent=`제${c.장}장`;title.textContent=c.제목;const body=plain(c.본문);summary.textContent=body.slice(0,145)+(body.length>145?'…':'');toggle.textContent='본문 보기';full.className='full';full.textContent=c.본문.replace(/^#{1,6}\s*/gm,'').replace(/\*\*/g,'');details.append(toggle,full);card.append(number,title,summary,details);cards.append(card)}if(!found.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='검색 결과가 없습니다. 다른 키워드를 입력해 주세요.';cards.append(empty)}}
input.addEventListener('input',render);document.getElementById('reset').addEventListener('click',()=>{input.value='';render();input.focus()});
fetch('./장데이터.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{if(!Array.isArray(data)||data.some(c=>!['장','제목','본문'].every(k=>typeof c[k]==='string')))throw Error('데이터 형식 오류');chapters=data;render()}).catch(()=>{count.textContent='장 데이터를 불러오지 못했습니다. 페이지를 새로고침해 주세요.'});
</script></body></html>
